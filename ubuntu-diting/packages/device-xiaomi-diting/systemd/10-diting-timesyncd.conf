# The phone has no clock to trust between boots: its RTC cannot be written
# from the AP and counts from 1970, so the system clock is only as good as
# the last NTP reply. Ubuntu's servers get no answer on the networks of
# China (2026-11-27: every request timed out, the clock 26 minutes behind);
# the two after them answered there. systemd-timesyncd tries the servers in
# turn.
[Time]
NTP=ntp.ubuntu.com ntp.aliyun.com cn.pool.ntp.org
