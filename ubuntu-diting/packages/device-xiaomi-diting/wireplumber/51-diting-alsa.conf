# Xiaomi Diting: keep the ALSA card on WirePlumber's raw split-PCM device
# instead of the 0.5 default ACP probing. ACP opens the pcm during profile
# probe, before diting-audio-mixer.service has enabled the DAPM mixer path
# the DPCM FE needs, so every profile comes up unavailable and only a
# dummy sink is created. With use-acp=false the pcm nodes are used
# directly and appear once the mixer unit has run.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~^alsa_card.platform-sound.*" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
      }
    }
  }
]
