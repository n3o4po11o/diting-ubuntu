---
# Builds of this tree in the container made from ci/Dockerfile. ci/BUILD.md
# has the details.
#
#   lint    every push and pull request: the builder image builds, shellcheck
#           finds no error in the shell scripts, and the tests of the ci
#           scripts pass
#   build   pushes to main, tags, weekly and by hand: the whole build from
#           zero, one step per stage, packaged as workflow artifacts
name: build

"on":
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "kernel/patches-experimental/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "kernel/patches-experimental/**"
  schedule:
    - cron: "23 3 * * 1"  # Mondays 03:23 UTC, on the default branch
  workflow_dispatch:

# The build of a new push replaces the build of the commit before it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  lint:
    name: Shell scripts and builder image (x86-64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the builder image
        run: >-
          docker build -t diting-builder:ci
          --build-arg VCS_REF="$GITHUB_SHA" ubuntu-diting/ci
      - name: shellcheck
        run: >-
          docker run --rm -v "$PWD:/src" -w /src diting-builder:ci
          ubuntu-diting/ci/lint.sh
      - name: Tests of the ci scripts
        run: >-
          docker run --rm -v "$PWD:/src" -w /src diting-builder:ci
          ubuntu-diting/ci/tests.sh /src /tmp/ci-tests

  build:
    name: From zero, packaged
    needs: lint
    # A hosted arm64 runner, free for public repositories: the build is the
    # native one of ci/BUILD.md. To build on a self-hosted runner instead, set
    # the repository variable BUILD_RUNNER to its label.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 350  # a hosted runner stops a job after 6 hours
    steps:
      - uses: actions/checkout@v7
      - name: Short commit
        run: echo "REV=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Free disk space
        run: |
          # The build needs about 65 GB at its peak. The preinstalled SDKs of
          # the runner image are not used here; with them gone, the runner had
          # 115 GB free. /opt/hostedtoolcache stays: JavaScript actions run on
          # its Node.
          for d in /usr/local/lib/android /usr/share/dotnet /opt/ghc \
              /opt/hostedtoolcache/CodeQL /usr/local/.ghcup; do
            sudo rm -rf "$d"
          done
          sudo docker image prune -af >/dev/null
          df -h /
      - name: Build the builder image
        run: >-
          docker build -t "diting-builder:$REV"
          --build-arg VCS_REF="$GITHUB_SHA" ubuntu-diting/ci
      # One step per stage. The log of a step is the output of its stage as it
      # runs, with a progress line every minute; when a stage fails, the end
      # of every build log it wrote follows there.
      - name: "Stage 1 of 9: check-host, sources"
        run: ubuntu-diting/ci/run-stage.sh check-host sources
      - name: "Stage 2 of 9: kernel"
        run: ubuntu-diting/ci/run-stage.sh --resume kernel
      - name: "Stage 3 of 9: packages"
        run: ubuntu-diting/ci/run-stage.sh --resume packages
      - name: "Stage 4 of 9: rootfs (owner)"
        run: ubuntu-diting/ci/run-stage.sh --resume rootfs
      - name: "Stage 5 of 9: sensors"
        run: ubuntu-diting/ci/run-stage.sh --resume sensors
      - name: "Stage 6 of 9: libcamera"
        run: ubuntu-diting/ci/run-stage.sh --resume libcamera
      - name: "Stage 7 of 9: phoc"
        run: ubuntu-diting/ci/run-stage.sh --resume phoc
      - name: "Stage 8 of 9: release (public image)"
        run: ubuntu-diting/ci/run-stage.sh --resume release
      - name: "Stage 9 of 9: verify"
        run: ubuntu-diting/ci/run-stage.sh --resume verify
      - name: Save the builder image and pack the artifacts
        env:
          TMP: ${{ runner.temp }}
        run: >-
          ubuntu-diting/ci/run-pack.sh
          "$TMP/stage" "$TMP/artifacts"
      - name: Result of the stages
        if: always()
        run: cat ubuntu-diting/output/fromzero/summary.txt || true
      - name: Upload the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: diting-${{ env.REV }}
          path: ${{ runner.temp }}/artifacts
          compression-level: 0  # already compressed: xz and zstd
          retention-days: 14
          if-no-files-found: error
      - name: Upload the logs of the stages and of the build scripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diting-${{ env.REV }}-logs
          path: |
            ubuntu-diting/output/fromzero
            ubuntu-diting/output/logs
          retention-days: 14
          if-no-files-found: ignore
